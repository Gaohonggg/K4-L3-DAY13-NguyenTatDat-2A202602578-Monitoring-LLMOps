service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Giữ mục tiêu 99.5% request thành công trong 3000 ms trên cửa sổ 28 ngày.
    Baseline CP0 có P95 1018 ms trên 10 request, chưa đủ mẫu để ước lượng tail latency dài hạn;
    ngưỡng 3000 ms dành khoảng dự phòng cho tải và mạng nhưng vẫn phát hiện request chậm nghiêm trọng.
    Error budget là 0.5% tổng request: với 10,000 request, tối đa 50 request lỗi hoặc vượt 3000 ms.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
