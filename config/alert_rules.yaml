alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms, 5m) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602578
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: '100 * count(request_failed, 5m) / count(request_received, 5m) > 2'
    duration: 5m
    min_requests: 10
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602578
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccess
    severity: warning
    condition: '100 * count(tool_name == "retrieval" and tool_success == true, 5m) / count(tool_name == "retrieval" and tool_success != null, 5m) < 90'
    duration: 5m
    min_attempts: 10
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602578
    runbook: docs/alerts.md#alert-3
